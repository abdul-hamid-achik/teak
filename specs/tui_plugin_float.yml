version: 1
name: teak_tui_plugin_float
coversSymbol: plugin.ui.new_float
metadata:
    feature: lua-plugin-ui
    owner: integration
    priority: high
    tags:
        - tui
        - plugin
        - lua
        - float
intent: |
    a Lua callback can show and dismiss a bounded read-only floating panel
target:
    cmd:
        - sh
        - -lc
        - >-
          set -eu; ROOT=$(pwd); TMP=$(mktemp -d); export HOME="$TMP/home"; export XDG_CONFIG_HOME="$TMP/config"; export XDG_STATE_HOME="$TMP/state"; PROJECT="$TMP/project"; CONFIG="$XDG_CONFIG_HOME/teak"; PLUGIN="$CONFIG/plugins/float"; mkdir -p "$HOME" "$PROJECT" "$PLUGIN"; printf '[session]\nenabled = false\n[agent]\nenabled = false\n' > "$CONFIG/config.toml"; printf 'package main\n' > "$PROJECT/main.txt"; printf 'name = "float"\nmain = "init.lua"\n' > "$PLUGIN/plugin.toml"; printf '%s\n' 'function setup()' '  keymap.set("a", "ctrl+f", function()' '    ui.new_float({title = "Preview", content = "generated output", width = 40, height = 4})' '  end)' 'end' > "$PLUGIN/init.lua"; "$ROOT/bin/teak" "$PROJECT/main.txt"
    cwd: "."
    timeoutMs: 15000
terminal:
    cols: 100
    rows: 30
    profile: xterm-256color
    alternateScreen: require
steps:
    - wait:
        screen:
            contains: "package main"
        timeoutMs: 5000
    - press: "ctrl+f"
    - wait:
        screen:
            contains: "Preview"
        timeoutMs: 5000
    - wait:
        screen:
            contains: "generated output"
        timeoutMs: 5000
    - press: "escape"
    - wait:
        screen:
            contains: "package main"
        timeoutMs: 5000
    - snapshot: plugin_float
    - press: "ctrl+q"
    - wait:
        process:
            exitCode: 0
        timeoutMs: 5000
outcomes:
    - id: clean_exit
      description: the plugin float remains within the normal TUI lifecycle
      verify:
        process:
            exitCode: 0
artifacts:
    finalScreen: never
contractHash: sha256:793505f76acf3c9dfba58ef0c49d797a11c56daa9436bb9199101c3038ee677b
