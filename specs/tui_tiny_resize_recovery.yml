version: 1
name: teak_tiny_resize_recovery
coversSymbol: app.Model.View
metadata:
  feature: terminal-resize
  owner: core-ui
  priority: high
  tags:
    - regression
    - resize
    - tiny-terminal
intent: |
  shrinking the terminal through one-, two-, and three-row layouts and restoring it
  does not overflow, crash, hang, or lose the open document.
target:
  cmd:
    - sh
    - testdata/glyphrun/run-teak.sh
    - tiny-resize
    - testdata/glyphrun/config/default.toml
    - testdata/glyphrun/workspace/alpha.txt
  cwd: "."
  timeoutMs: 15000
terminal:
  cols: 80
  rows: 24
  profile: xterm-256color
  alternateScreen: require
preconditions:
  commands:
    - run: "go build -o ./bin/teak ./cmd/teak"
      timeoutMs: 30000
steps:
  - wait:
      screen:
        contains: "alpha one"
      timeoutMs: 5000
  - resize: {cols: 1, rows: 1}
  - press: "esc"
  - snapshot: one_by_one
  - resize: {cols: 12, rows: 2}
  - press: "esc"
  - wait:
      screen:
        contains: "F1 Help"
      timeoutMs: 2000
  - snapshot: two_rows
  - resize: {cols: 12, rows: 3}
  - press: "esc"
  - wait:
      screen:
        contains: "F1 Help"
      timeoutMs: 2000
  - snapshot: three_rows
  - resize: {cols: 12, rows: 5}
  - press: "esc"
  - wait:
      screen:
        contains: "F1 Help"
      timeoutMs: 2000
  - snapshot: narrow_terminal
  - resize: {cols: 80, rows: 24}
  - press: "esc"
  - wait:
      screen:
        contains: "alpha one"
      timeoutMs: 5000
  - snapshot: restored_terminal
  - press: "ctrl+q"
  - wait:
      process:
        exitCode: 0
      timeoutMs: 3000
outcomes:
  - id: document_recovers_after_tiny_resize
    description: restoring the terminal renders the same open document
    verify:
      screen:
        contains: "alpha one"
  - id: clean_exit
    description: the process remains healthy through the resize sequence
    verify:
      process:
        exitCode: 0
