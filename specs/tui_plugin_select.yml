version: 1
name: teak_tui_plugin_select
coversSymbol: plugin.ui.select
metadata:
    feature: lua-plugin-ui
    owner: integration
    priority: high
    tags:
        - tui
        - plugin
        - lua
        - picker
intent: |
    a Lua callback can open the fuzzy selector and resume after choosing an
    item or explicitly cancelling it
target:
    cmd:
        - sh
        - -lc
        - >-
          set -eu; ROOT=$(pwd); TMP=$(mktemp -d); export HOME="$TMP/home"; export XDG_CONFIG_HOME="$TMP/config"; export XDG_STATE_HOME="$TMP/state"; PROJECT="$TMP/project"; case "$(uname)" in Darwin) CONF_BASE="$HOME/Library/Application Support" ;; *) CONF_BASE="$HOME/.config"; if [ -n "$XDG_CONFIG_HOME" ]; then CONF_BASE="$XDG_CONFIG_HOME"; fi ;; esac; CONFIG="$CONF_BASE/teak"; PLUGIN="$CONFIG/plugins/select"; mkdir -p "$HOME" "$PROJECT" "$PLUGIN"; printf '[session]\nenabled = false\n[agent]\nenabled = false\n' > "$CONFIG/config.toml"; printf 'package main\n' > "$PROJECT/main.go"; printf 'name = "select"\nmain = "init.lua"\n' > "$PLUGIN/plugin.toml"; printf '%s\n' 'function setup()' '  keymap.set("a", "ctrl+l", function()' '    ui.select("Choose target", {"one", "two"}, function(option, index, accepted)' '      editor.set_status("SELECT_" .. option .. "_" .. tostring(index) .. "_" .. tostring(accepted))' '    end)' '  end)' 'end' > "$PLUGIN/init.lua"; "$ROOT/bin/teak" "$PROJECT/main.go"
    cwd: "."
    timeoutMs: 15000
terminal:
    cols: 100
    rows: 30
    profile: xterm-256color
    alternateScreen: require
steps:
    - wait:
        screen:
            contains: "package main"
        timeoutMs: 5000
    - press: "ctrl+l"
    - wait:
        screen:
            contains: "Choose target"
        timeoutMs: 5000
    - press: "down"
    - press: "enter"
    - wait:
        screen:
            contains: "SELECT_two_2_true"
        timeoutMs: 5000
    - press: "ctrl+l"
    - wait:
        screen:
            contains: "Choose target"
        timeoutMs: 5000
    - press: "escape"
    - wait:
        screen:
            contains: "SELECT__0_false"
        timeoutMs: 5000
    - snapshot: plugin_select
    - press: "ctrl+q"
    - wait:
        process:
            exitCode: 0
        timeoutMs: 5000
outcomes:
    - id: clean_exit
      description: the interaction steps prove selection and cancellation while the selector remains within the normal TUI lifecycle
      verify:
        process:
            exitCode: 0
contractHash: sha256:9fc9c5146199213106740e36551a2768d1c6c4a3a282a582bb4f57e649c21076
