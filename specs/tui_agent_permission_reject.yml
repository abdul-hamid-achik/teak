version: 1
name: teak_tui_agent_permission_reject
coversSymbol: agent.Model.handlePermissionKey
metadata:
    feature: safe-agent-runtime
    owner: integration
    priority: high
    tags:
        - tui
        - agent
        - acp
        - permission
        - rejection
intent: |
    an ACP tool request resumes with an explicit denial and does not strand
    the agent subprocess
target:
    cmd:
        - sh
        - -lc
        - >-
          set -eu; ROOT=$(pwd); TMP=$(mktemp -d); HOME_DIR="$TMP/home"; CONFIG_HOME="$TMP/config"; PROJECT="$TMP/project"; mkdir -p "$HOME_DIR" "$CONFIG_HOME/teak" "$PROJECT"; printf '%s\n' '[editor]' 'tab_size = 4' '[ui]' 'show_tree = false' '[agent]' 'enabled = true' 'command = "python3"' "args = [\"$ROOT/testdata/glyphrun/acp-agent-fixture.py\", \"--permission\"]" '[session]' 'enabled = false' > "$CONFIG_HOME/teak/config.toml"; printf '%s\n' 'package main' > "$PROJECT/main.go"; export HOME="$HOME_DIR" XDG_CONFIG_HOME="$CONFIG_HOME" XDG_STATE_HOME="$TMP/state" LANG=C LC_ALL=C TZ=UTC; exec "$ROOT/bin/teak" "$PROJECT/main.go"
    cwd: "."
    timeoutMs: 15000
terminal:
    cols: 120
    rows: 40
    profile: xterm-256color
    alternateScreen: require
steps:
    - wait:
        screen:
            contains: "Agent"
        timeoutMs: 5000
    - press: "ctrl+j"
    - wait:
        screen:
            contains: "Ask the agent..."
        timeoutMs: 5000
    - type: "run the safe fixture"
    - press: "enter"
    - wait:
        screen:
            contains: "Agent wants to:"
        timeoutMs: 5000
    - press: "n"
    - wait:
        screen:
            contains: "PERMISSION_NOT_GRANTED"
        timeoutMs: 5000
    - wait:
        screen:
            contains: "●"
        timeoutMs: 5000
    - snapshot: tui_agent_permission_reject
    - press: "ctrl+q"
    - wait:
        process:
            exitCode: 0
        timeoutMs: 5000
outcomes:
    - id: clean_exit
      description: rejecting permission does not strand the ACP process or editor
      verify:
        process:
            exitCode: 0
contractHash: sha256:61364b4ddd1714f2d51a28c73e32eab0b1e4f9a241e6d54c63488976854ca315
