version: 1
name: teak_tui_plugin_input
coversSymbol: plugin.ui.input
metadata:
    feature: lua-plugin-ui
    owner: integration
    priority: high
    tags:
        - tui
        - plugin
        - lua
        - input
intent: |
    a Lua callback can request bounded text input and resume after accept or
    explicit cancellation
target:
    cmd:
        - sh
        - -lc
        - >-
          set -eu; ROOT=$(pwd); TMP=$(mktemp -d); export HOME="$TMP/home"; export XDG_CONFIG_HOME="$TMP/config"; export XDG_STATE_HOME="$TMP/state"; PROJECT="$TMP/project"; case "$(uname)" in Darwin) CONF_BASE="$HOME/Library/Application Support" ;; *) CONF_BASE="$HOME/.config"; if [ -n "$XDG_CONFIG_HOME" ]; then CONF_BASE="$XDG_CONFIG_HOME"; fi ;; esac; CONFIG="$CONF_BASE/teak"; PLUGIN="$CONFIG/plugins/input"; mkdir -p "$HOME" "$PROJECT" "$PLUGIN"; printf '[session]\nenabled = false\n[agent]\nenabled = false\n' > "$CONFIG/config.toml"; printf 'package main\n' > "$PROJECT/main.go"; printf 'name = "input"\nmain = "init.lua"\n' > "$PLUGIN/plugin.toml"; printf '%s\n' 'function setup()' '  keymap.set("a", "ctrl+e", function()' '    ui.input("Branch name", "feature/", function(value, accepted)' '      editor.set_status("INPUT_" .. value .. "_" .. tostring(accepted))' '    end)' '  end)' 'end' > "$PLUGIN/init.lua"; "$ROOT/bin/teak" "$PROJECT/main.go"
    cwd: "."
    timeoutMs: 15000
terminal:
    cols: 100
    rows: 30
    profile: xterm-256color
    alternateScreen: require
steps:
    - wait:
        screen:
            contains: "package main"
        timeoutMs: 5000
    - press: "ctrl+e"
    - wait:
        screen:
            contains: "Branch name"
        timeoutMs: 5000
    - press: "enter"
    - wait:
        screen:
            contains: "INPUT_feature/_true"
        timeoutMs: 5000
    - press: "ctrl+e"
    - wait:
        screen:
            contains: "Branch name"
        timeoutMs: 5000
    - press: "escape"
    - wait:
        screen:
            contains: "INPUT__false"
        timeoutMs: 5000
    - snapshot: plugin_input
    - press: "ctrl+q"
    - wait:
        process:
            exitCode: 0
        timeoutMs: 5000
outcomes:
    - id: clean_exit
      description: the plugin input remains within the normal TUI lifecycle
      verify:
        process:
            exitCode: 0
artifacts:
    finalScreen: never
contractHash: sha256:27be9aca569a2dd621a0f2a5bf181a23176337c04a6cd6b80ac58a2f5bd3fe8a
