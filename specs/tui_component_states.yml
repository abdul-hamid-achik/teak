version: 1
name: teak_component_states
coversSymbol: ui.ThemeByName
metadata:
    feature: component-stories
    owner: core-ui
    priority: high
    tags: [tui, story, themes, deterministic]
intent: |
    Real Teak components render their empty, loading, error and populated states
    within the terminal bounds, using the selected theme at wide and narrow sizes.
target:
    cmd: [./bin/teak-component-story]
    cwd: .
    timeoutMs: 30000
terminal:
    cols: 80
    rows: 24
    profile: xterm-256color
    alternateScreen: require
preconditions:
    commands:
        - run: go build -o ./bin/teak-component-story ./testdata/glyphrun/component-story
          timeoutMs: 30000
steps:
    - wait:
        screen: {contains: "Stage: editor"}
    - wait:
        screen: {notContains: "OVERFLOW"}
    - wait:
        screen: {contains: "Compute the total"}
    - snapshot: editor_80
    - press: enter
    - wait:
        screen: {contains: "Stage: completion-loading"}
    - wait:
        screen: {notContains: "OVERFLOW"}
    - wait:
        screen: {contains: "Loading..."}
    - snapshot: completion-loading_80
    - press: enter
    - wait:
        screen: {contains: "Stage: completion-ready"}
    - wait:
        screen: {notContains: "OVERFLOW"}
    - wait:
        screen: {contains: "func([]int) int"}
    - snapshot: completion-ready_80
    - press: enter
    - wait:
        screen: {contains: "Stage: search-empty"}
    - wait:
        screen: {notContains: "OVERFLOW"}
    - wait:
        screen: {contains: "Search..."}
    - snapshot: search-empty_80
    - press: enter
    - wait:
        screen: {contains: "Stage: search-loading"}
    - wait:
        screen: {notContains: "OVERFLOW"}
    - wait:
