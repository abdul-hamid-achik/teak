    - wait:
        screen: {notContains: "OVERFLOW"}
    - wait:
        screen: {contains: "/fixture/sample.go:2"}
    - snapshot: search-results_80
    - press: enter
    - wait:
        screen: {contains: "Stage: git-empty"}
    - wait:
        screen: {notContains: "OVERFLOW"}
    - wait:
        screen: {contains: "STAGED (0)"}
    - snapshot: git-empty_80
    - press: enter
    - wait:
        screen: {contains: "Stage: git-changes"}
    - wait:
        screen: {notContains: "OVERFLOW"}
    - wait:
        screen: {contains: "Readable selections"}
