version: 1
name: teak_theme_preview_save
coversSymbol: app.Model.applyTheme
metadata:
    feature: themes
    owner: core-ui
    priority: high
    tags: [regression, story, keyboard, theme]
intent: |
    Selecting GitHub Light previews the theme, saving applies it without a
    restart, and the editor renders explicit readable foreground/background colors.
target:
    cmd: [sh, testdata/glyphrun/run-teak.sh, theme-save, testdata/glyphrun/config/default.toml, testdata/glyphrun/workspace/alpha.txt]
    cwd: "."
    timeoutMs: 15000
terminal:
    cols: 80
    rows: 24
    profile: xterm-256color
    alternateScreen: require
preconditions:
    commands:
        - run: "go build -o ./bin/teak ./cmd/teak"
          timeoutMs: 30000
steps:
    - wait:
        screen: {contains: "alpha one"}
        timeoutMs: 5000
    - send: {bytes: "\\x1b[44;5u"}
    - wait:
        screen: {contains: "Settings"}
    - press: tab
    - press: enter
    - wait:
        screen: {contains: "Choose theme"}
    - type: "github-light"
    - wait:
        screen: {contains: "GitHub Light"}
    - snapshot: theme_picker
    - press: enter
    - wait:
        screen: {contains: "Theme preview active"}
    - snapshot: light_preview
    - press: ctrl+s
    - wait:
        screen: {contains: "Settings saved and applied"}
    - press: esc
    - wait:
        screen: {notContains: "User Interface"}
    - snapshot: light_editor
outcomes:
    - id: light_editor_colors
      description: the active editor line has GitHub Light colors after saving
      verify:
        cell:
            x: 30
            y: 1
            char: a
            style: {fg: "#24292f", bg: "#f6f8fa"}
    - id: readable_position
      description: the position indicator uses white text on the blue accent
      verify:
        cell:
            x: 57
            y: 23
            char: L
            style: {fg: "#ffffff", bg: "#0969da"}
    - id: themed_save_feedback
      description: save feedback has explicit theme colors after styled help text
      verify:
        cell:
            x: 23
            y: 23
            char: S
            style: {fg: "#24292f", bg: "#f6f8fa"}
artifacts:
    finalScreen: never
contractHash: sha256:15a9df032f5c03f220b78a8cfe31617487a314b61d6961b091bf95536f655104
