version: 1
name: teak_edit_save
coversSymbol: app.Model.Update
metadata:
    feature: editor-save
    owner: core-ui
    priority: high
    tags:
        - smoke
        - editing
        - persistence
intent: |
    a user can edit a file, save it, close the editor, and leave the persisted
    content verified by the terminal harness.
target:
    cmd:
        - sh
        - testdata/glyphrun/run-teak.sh
        - edit-save
        - testdata/glyphrun/config/default.toml
        - testdata/glyphrun/workspace/alpha.txt
        - assert-first-line
        - Xalpha one
    cwd: "."
    timeoutMs: 15000
terminal:
    cols: 80
    rows: 24
    profile: xterm-256color
    alternateScreen: require
preconditions:
    commands:
        - run: "go build -o ./bin/teak ./cmd/teak"
          timeoutMs: 30000
steps:
    - wait:
        screen:
            contains: "alpha one"
        timeoutMs: 5000
    - type: "X"
    - wait:
        screen:
            contains: "Xalpha one"
        timeoutMs: 5000
    - press: "ctrl+s"
    - wait:
        screen:
            contains: "Saved"
        timeoutMs: 3000
    - press: "ctrl+q"
    - wait:
        process:
            exitCode: 0
        timeoutMs: 5000
    - snapshot: persisted_edit
outcomes:
    - id: edit_visible
      description: the inserted character appears in the active editor
      verify:
        screen:
            contains: "Xalpha one"
    - id: save_confirmed
      description: the save command reports a successful persistence event
      verify:
        screen:
            contains: "Saved"
    - id: persisted_file_verified
      description: the harness confirms the saved first line after Teak exits
      verify:
        screen:
            contains: "SAVE_ASSERT_OK"
contractHash: sha256:56e82b6c25e1ad0bc1de34c09f9d625b7a4e0696cf5a787253f406a5117ee694
