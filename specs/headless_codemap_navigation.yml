version: 1
name: teak_headless_codemap_navigation
coversSymbol: runHeadlessCodemap
metadata:
    feature: project-intelligence
    owner: integration
    priority: high
    tags:
        - headless
        - codemap
        - navigation
intent: |
    a headless client can list symbols in one file and resolve the enclosing
    symbol at a 0-based line without implicitly indexing the project.
target:
    cmd:
        - sh
        - -lc
        - >-
          set -eu; ROOT=$(pwd); TMP=$(mktemp -d); export HOME="$TMP/home"; export PATH="$TMP/bin:$PATH"; export CODEMAP_TRACE="$TMP/calls"; PROJECT="$TMP/project"; mkdir -p "$TMP/bin" "$HOME" "$PROJECT"; : > "$CODEMAP_TRACE"; printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$*" >> "$CODEMAP_TRACE"' 'if [ "$1" = "--version" ]; then printf "%s\n" "codemap fixture"; exit 0; fi' 'if [ "$1" = "symbols" ]; then printf "%s\n" "[{\"symbol\":\"Greeter\",\"fqn\":\"fixture.Greeter\",\"kind\":\"type\",\"file\":\"main.go\",\"start_line\":3,\"end_line\":5}]"; exit 0; fi' 'if [ "$1" = "symbol-at" ]; then printf "%s\n" "{\"symbol\":\"Greeter\",\"fqn\":\"fixture.Greeter\",\"kind\":\"type\",\"file\":\"main.go\",\"start_line\":3,\"end_line\":5}"; exit 0; fi' 'exit 0' > "$TMP/bin/codemap"; chmod 755 "$TMP/bin/codemap"; printf 'package main\n\n type Greeter struct{}\n' > "$PROJECT/main.go"; SYMBOLS=$("$ROOT/bin/teak" headless codemap symbols --json --root "$PROJECT" main.go); AT=$("$ROOT/bin/teak" headless codemap symbol-at --line 3 --json --root "$PROJECT" main.go); python3 -c "import json,sys; s,a=map(json.loads,sys.argv[1:3]); assert s.get('state') == 'ready' and s.get('operation') == 'symbols' and s.get('path') == 'main.go' and s.get('results',[{}])[0].get('symbol') == 'Greeter'; assert a.get('state') == 'ready' and a.get('operation') == 'symbol-at' and a.get('path') == 'main.go' and a.get('line') == 3 and a.get('results',[{}])[0].get('symbol') == 'Greeter'; calls=open(sys.argv[3]).read().splitlines(); assert all(not line.startswith('init') and not line.startswith('index') for line in calls)" "$SYMBOLS" "$AT" "$CODEMAP_TRACE"; printf '%s\n' 'CODEMAP_NAVIGATION_JSON_OK'
    cwd: "."
    timeoutMs: 15000
terminal:
    cols: 120
    rows: 40
    profile: xterm-256color
steps:
    - wait:
        process:
            exitCode: 0
        timeoutMs: 10000
    - snapshot: codemap_navigation
outcomes:
    - id: symbols_reported
      description: the file symbol query returns bounded structured metadata
      verify:
        screen:
            contains: "CODEMAP_NAVIGATION_JSON_OK"
    - id: symbol_at_reported
      description: the line query resolves the enclosing symbol with 0-based coordinates
      verify:
        screen:
            contains: "CODEMAP_NAVIGATION_JSON_OK"
    - id: codemap_navigation_is_read_only
      description: fixture-side assertions prove navigation did not run init or index
      verify:
        screen:
            contains: "CODEMAP_NAVIGATION_JSON_OK"
contractHash: sha256:4a9d1ce619e37cd3a3276ccf8afc4509b385e68bb7c418f670bf02e1616dd31b
