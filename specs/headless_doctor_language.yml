version: 1
name: teak_headless_doctor_language
coversSymbol: runDoctorCLI
metadata:
  feature: onboarding
  owner: integration
  priority: high
  tags:
    - headless
    - doctor
    - lsp
    - onboarding
intent: |
  a fresh project reports the detected language and its relevant language-server state.
target:
  cmd:
    - sh
    - -lc
    - >-
      set -eu; ROOT=$(pwd); TMP=$(mktemp -d); export HOME="$TMP/home"; PROJECT="$TMP/project"; mkdir -p "$HOME" "$PROJECT"; printf 'package main\n' > "$PROJECT/main.go"; JSON=$("$ROOT/bin/teak" doctor --json --root "$PROJECT"); printf '%s' "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); langs=[l for l in d.get('languages',[]) if l.get('language_id')=='go']; assert langs, 'no go language detected'; assert langs[0].get('server')=='gopls', langs; assert langs[0].get('state') in ('available','missing','failed','timed_out','unsupported'), langs"; printf 'DOCTOR_GO_LANGUAGE_OK\n'
  cwd: "."
  timeoutMs: 15000
terminal:
  cols: 120
  rows: 40
  profile: xterm-256color
steps:
  - wait:
      process:
        exitCode: 0
      timeoutMs: 10000
  - snapshot: doctor_language
outcomes:
  - id: go_language_detected
    description: the doctor run detected Go, validated the gopls server and state, and printed its completion marker
    verify:
      screen:
        contains: "DOCTOR_GO_LANGUAGE_OK"
