version: 1
name: teak_tui_plugin_confirm
coversSymbol: plugin.ui.confirm
metadata:
    feature: lua-plugin-ui
    owner: integration
    priority: high
    tags:
        - tui
        - plugin
        - lua
        - modal
intent: |
    a Lua callback can request a non-blocking confirmation and resume after
    the user accepts it
target:
    cmd:
        - sh
        - -lc
        - >-
          set -eu; ROOT=$(pwd); TMP=$(mktemp -d); export HOME="$TMP/home"; export XDG_CONFIG_HOME="$TMP/config"; export XDG_STATE_HOME="$TMP/state"; PROJECT="$TMP/project"; CONFIG="$XDG_CONFIG_HOME/teak"; PLUGIN="$CONFIG/plugins/confirm"; mkdir -p "$HOME" "$PROJECT" "$PLUGIN"; printf '[session]\nenabled = false\n[agent]\nenabled = false\n' > "$CONFIG/config.toml"; printf 'package main\n' > "$PROJECT/main.txt"; printf 'name = "confirm"\nmain = "init.lua"\n' > "$PLUGIN/plugin.toml"; printf '%s\n' 'function setup()' '  keymap.set("a", "ctrl+c", function()' '    ui.confirm("Deploy changes?", {"Deploy", "Cancel"}, function(option, index, accepted)' '      editor.set_status("CONFIRM_" .. option .. "_" .. tostring(index) .. "_" .. tostring(accepted))' '    end)' '  end)' 'end' > "$PLUGIN/init.lua"; "$ROOT/bin/teak" "$PROJECT/main.txt"
    cwd: "."
    timeoutMs: 15000
terminal:
    cols: 100
    rows: 30
    profile: xterm-256color
    alternateScreen: require
steps:
    - wait:
        screen:
            contains: "package main"
        timeoutMs: 5000
    - press: "ctrl+c"
    - wait:
        screen:
            contains: "Deploy changes?"
        timeoutMs: 5000
    - press: "enter"
    - wait:
        screen:
            contains: "CONFIRM_Deploy_1_true"
        timeoutMs: 5000
    - snapshot: plugin_confirm
    - press: "ctrl+q"
    - wait:
        process:
            exitCode: 0
        timeoutMs: 5000
outcomes:
    - id: clean_exit
      description: the plugin confirmation remains within the normal TUI lifecycle
      verify:
        process:
            exitCode: 0
artifacts:
    finalScreen: never
contractHash: sha256:05f13bb6ee6de086071a9b13f61a64a12e32e753cabec2e9441c8a15a692aaa6
