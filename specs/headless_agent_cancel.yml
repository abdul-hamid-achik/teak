version: 1
name: teak_headless_agent_cancel
coversSymbol: runHeadlessAgent
metadata:
    feature: agent-runtime
    owner: integration
    priority: high
    tags:
        - headless
        - agent
        - cancellation
intent: |
    the headless agent supervisor can explicitly cancel a persisted active run
    only with confirmation and reports the terminal state
target:
    cmd:
        - sh
        - -lc
        - >-
          set -eu; ROOT=$(pwd); TMP=$(mktemp -d); export HOME="$TMP/home"; export XDG_STATE_HOME="$TMP/state"; PROJECT="$TMP/project"; mkdir -p "$HOME" "$PROJECT"; printf 'package main\n' > "$PROJECT/main.go"; RUNS_DIR="$TMP/state/teak/agent-runs/$(python3 -c 'import hashlib,os,sys; print(hashlib.sha256(os.path.realpath(sys.argv[1]).encode()).hexdigest())' "$PROJECT")"; mkdir -p "$RUNS_DIR"; python3 -c "import json,sys; root=sys.argv[1]; run={'id':'active-run','depth':0,'status':'running','spec':{'objective':'active fixture run','workspace':root,'requested_capabilities':{'read':True},'budget':{}},'effective_capabilities':{'read':True},'created_at':'2020-01-01T00:00:00Z','started_at':'2020-01-01T00:00:00Z','last_heartbeat_at':'2020-01-01T00:00:00Z'}; json.dump({'version':1,'runs':[run]},open(sys.argv[2],'w'))" "$PROJECT" "$RUNS_DIR/runs.json"; if "$ROOT/bin/teak" headless agent cancel --json --root "$PROJECT" active-run >/dev/null 2>&1; then exit 3; fi; JSON=$("$ROOT/bin/teak" headless agent cancel --confirm --json --root "$PROJECT" active-run); python3 -c "import json,sys; p=json.loads(sys.argv[1]); assert p.get('state') == 'cancelled' and p.get('run_id') == 'active-run'; stored=json.load(open(sys.argv[2])); assert stored['runs'][0]['status'] == 'cancelled'" "$JSON" "$RUNS_DIR/runs.json"; printf '%s\nAGENT_CANCEL_JSON_OK\n' "$JSON"
    cwd: "."
    timeoutMs: 10000
terminal:
    cols: 110
    rows: 30
    profile: xterm-256color
steps:
    - wait:
        process:
            exitCode: 0
        timeoutMs: 3000
    - snapshot: agent_cancel
outcomes:
    - id: confirmation_required
      description: cancellation refuses to mutate without explicit confirmation
      verify:
        screen:
            contains: "AGENT_CANCEL_JSON_OK"
    - id: active_run_cancelled
      description: the confirmed operation persists a cancelled active run
      verify:
        screen:
            contains: "AGENT_CANCEL_JSON_OK"
    - id: machine_response
      description: the cancellation response exposes state and the run id
      verify:
        screen:
            contains: "AGENT_CANCEL_JSON_OK"
artifacts:
    finalScreen: never
contractHash: sha256:8e5420b98a31b3ad002ab63549fd7f2dbdf8a5e2d12f8ea8920f92a296767dd1
