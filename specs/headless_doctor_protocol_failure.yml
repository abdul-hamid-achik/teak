version: 1
name: teak_headless_doctor_protocol_failure
coversSymbol: runDoctorCLI
metadata:
    feature: onboarding
    owner: integration
    priority: high
    tags:
        - headless
        - doctor
        - lsp
        - protocol-probe
        - broken-tool
intent: |
    a resolved LSP without a CLI version command is not advertised as healthy
    when its initialize handshake fails, and the generic tool check reuses that
    protocol failure.
target:
    cmd:
        - sh
        - -lc
        - >-
          set -eu; ROOT=$(pwd); TMP=$(mktemp -d); export HOME="$TMP/home"; export XDG_CONFIG_HOME="$HOME/.config"; PROJECT="$TMP/project"; mkdir -p "$TMP/bin" "$HOME/.config/teak" "$PROJECT"; printf '[[lsp]]\nextensions = [".fixture"]\ncommand = "pylsp"\nlanguage_id = "fixture"\n' > "$HOME/.config/teak/config.toml"; printf 'fixture\n' > "$PROJECT/main.fixture"; printf '%s\n' '#!/bin/sh' 'exit 0' > "$TMP/bin/pylsp"; chmod 755 "$TMP/bin/pylsp"; PATH="$TMP/bin:$PATH"; export PATH; JSON=$("$ROOT/bin/teak" doctor --json --root "$PROJECT"); python3 -c "import json,sys; p=json.loads(sys.argv[1]); langs=[l for l in p.get('languages',[]) if l.get('language_id') == 'fixture']; checks=[c for c in p.get('checks',[]) if c.get('name') == 'tool:pylsp']; assert len(langs) == 1 and langs[0].get('state') == 'failed' and langs[0].get('version_probe') == 'unsupported' and langs[0].get('protocol_probe') == 'failed' and len(checks) == 1 and checks[0].get('status') == 'warn' and 'protocol probe failed' in checks[0].get('detail','')" "$JSON"; printf '%s\nDOCTOR_PROTOCOL_FAILURE_JSON_OK\n' "$JSON"
    cwd: "."
    timeoutMs: 10000
terminal:
    cols: 120
    rows: 50
    profile: xterm-256color
steps:
    - wait:
        process:
            exitCode: 0
        # Doctor may legitimately consume its 2s language budget followed by
        # its 3s general-tool budget. Keep slack below the target's 10s hard cap.
        timeoutMs: 9000
outcomes:
    - id: protocol_probe_failure_reported
      description: a broken protocol-only server is failed in both language and tool views
      verify:
        screen:
            contains: "DOCTOR_PROTOCOL_FAILURE_JSON_OK"
contractHash: sha256:0019543d3aa6cb3f28919daa7cb2dd460071db1a6cd98bf77961dc9c8831367e
