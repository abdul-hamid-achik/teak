name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Build
        run: go build ./...

      - name: Test with race detection and coverage
        run: go test ./... -v -count=1 -race -p 1 -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold
        run: |
          # Get overall coverage percentage
          COVERAGE=$(go tool cover -func=coverage.out | grep "total:" | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"

          # Per-package coverage
          echo ""
          echo "Per-package coverage:"
          go test ./... -p 1 -cover 2>&1 | grep -E "coverage:|no test files" || true

          # Keep CI below the current repository baseline only when coverage
          # regresses materially; the local baseline is above 70%.
          THRESHOLD="70"
          COVERAGE_INT=$(echo "$COVERAGE" | cut -d'.' -f1)
          if [ "$COVERAGE_INT" -lt "$THRESHOLD" ]; then
            echo "❌ Coverage ${COVERAGE}% is below threshold of ${THRESHOLD}%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold of ${THRESHOLD}%"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: Vet
        run: go vet ./...

      - name: Verify bounded external-tool measurement contract
        run: sh scripts/perf-tools-test.sh

      - name: Build binary
        run: go build -o bin/teak ./cmd/teak

  glyphrun:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Build Teak
        run: go build -o ./bin/teak ./cmd/teak

      - name: Install Glyphrun
        run: sh scripts/install-glyphrun.sh

      - name: Run Glyphrun specs with stability probe
        run: |
          GOPATH_BIN="$(go env GOPATH)/bin"
          export PATH="$PATH:$GOPATH_BIN"
          # tui_agent_* specs are excluded on Linux: the agent panel connects but
          # the TUI exits early under a Linux PTY (known glyphrun issue; they pass
          # on macOS). See the 2026-08-04 investigation notes.
          SPECS="$(ls specs/*.yml | grep -v tui_agent_)"
          glyph run $SPECS --parallel 1 --repeat 3 --progress auto --junit .glyphrun/glyphrun-repeat-ci-junit.xml

      - name: Upload Glyphrun JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glyphrun-repeat-junit
          path: .glyphrun/glyphrun-repeat-ci-junit.xml
          if-no-files-found: ignore

      - name: Upload glyphrun artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glyphrun-artifacts
          path: .glyphrun/runs/
          retention-days: 7
